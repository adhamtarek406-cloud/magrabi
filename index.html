document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

Answer every question. 80% or above passes, records your completion in iLearn, and unlocks the shop-floor summary. You can retake it as many times as you need.',\n        ''\n      ],\n      patientLabel: 'Patient', recommendLabel: 'Recommend', back: '← Back', continuePrefix: 'Continue → ',\n      begin: 'Begin module', resume: 'Resume module',\n      nav: [\n        { title: 'The Lens', short: 'The Lens', time: '4 min', blurb: 'What it does, how it differs from a progressive, the four boosts.' },\n        { title: 'The Office Worker', short: 'Office Worker', time: '5 min', blurb: 'Nour, 34 — a clear brief and a direct recommendation.' },\n        { title: 'The Mature Patient', short: 'Mature Patient', time: '5 min', blurb: 'Khalid, 43 — an objection to handle before an optic to solve.' },\n        { title: 'Knowledge Check', short: 'Check', time: '3 min', blurb: 'Four decisions. 80% to complete the module.' },\n        { title: 'On the Shop Floor', short: 'Shop Floor', time: '2 min', blurb: 'What to carry to the counter tomorrow morning.' }\n      ],\n      home: {\n        eyebrow: 'Product Knowledge · New Launch', title: 'Zwei Ease Anti-Fatigue Lens',\n        sub: 'A small assist where the eye works hardest. Learn to read the signs across the counter, match the right boost, and recommend with the quiet confidence a MAGRABi consultation deserves.',\n        stats: [['5', 'Sections'], ['18 min', 'Learner time'], ['80%', 'To complete']]\n      },\n      l1: {\n        eyebrow: '01 · The Lens', h2: 'A small assist, exactly where the eye works hardest',\n        body: 'An anti-fatigue lens carries a slight positive power in the near zone. That small boost relaxes accommodation — the constant focusing effort behind heavy eyes at 6pm. Distance vision stays exactly as your patient knows it.',\n        quotePre: 'Zwei Ease is marked and dispensed as a ', quoteEm: 'single-vision lens', quotePost: '. Say that early — it changes how the patient listens.',\n        candTitle: 'Who is a candidate?', candSub: 'Anyone who is not already a progressive wearer — with or without a distance prescription. Tap each behaviour to see what the patient actually says.',\n        addTitle: 'Four boosts, four kinds of day', addSub: 'Select an addition to see the patient it was made for.', scopeLabel: 'In scope',\n        tabs: [\n          { label: 'Anti-fatigue', caption: 'Zwei Ease · near boost', rows: [\n            { k: 'Viewing areas', v: 'One continuous field — distance as the patient knows it, with a slight boost low in the lens.' },\n            { k: 'Visual distortion', v: 'Negligible lateral softness. The addition is too small to create a corridor.' },\n            { k: 'Dispensed as', v: 'Single vision. No adaptation briefing, no head-turning to find the zone.' }\n          ] },\n          { label: 'Progressive', caption: 'Progressive · three zones', rows: [\n            { k: 'Viewing areas', v: 'Distance, intermediate and near, stacked — each reached by moving the head, not the eyes.' },\n            { k: 'Visual distortion', v: 'Lateral blur either side of the corridor, strongest in the lower periphery.' },\n            { k: 'Dispensed as', v: 'A progressive. Adaptation is expected and must be explained up front.' }\n          ] }\n        ],\n        cards: [\n          { title: 'Long hours on screens', hint: 'What the patient says', body: '“I’m on the laptop from nine to six, then it’s my phone all evening.”' },\n          { title: 'Multiple screens at once', hint: 'What the patient says', body: '“I’ve got two monitors and my phone next to the keyboard — my eyes are always jumping.”' },\n          { title: 'Strain despite current glasses', hint: 'What the patient says', body: '“My prescription is fine, but reading anything on a screen is an effort now.”' },\n          { title: 'Headaches and blurred vision', hint: 'What the patient says', body: '“I get a dull ache behind my eyes and things go soft when I look up.”' }\n        ],\n        reveal: 'Reveal', hide: 'Hide',\n        adds: [\n          { name: 'Kids', body: 'Six to twenty-five. School days spent switching between the board, the notebook and a laptop, then a screen at home. The lightest boost prevents strain before it becomes a habit.', scope: 'Covered in the full programme — not assessed in this module.' },\n          { name: 'University students & gamers', body: 'Long reading sessions, night study, long play. Focus jumps between book, monitor and phone for most of the waking day, often in poor light.', scope: 'Covered in the full programme — not assessed in this module.' },\n          { name: 'Office & remote workers', body: 'Around eight hours a day at a screen, with document and monitor shifts all day and real rest away from near work in the evening.', scope: 'Assessed in this module — Section 02, Nour.' },\n          { name: 'Mature patients, 40+', body: 'Early presbyopia with a screen-heavy or reading-heavy day, and resistance to progressive lenses. The largest boost, chosen on visual demand rather than age.', scope: 'Assessed in this module — Section 03, Khalid.' }\n        ]\n      },\n      l2: {\n        eyebrow: '02 · The Office Worker', h2: 'Eight hours, two monitors, one tired pair of eyes',\n        name: 'Nour, 34', meta: 'Marketing manager · Dubai · Wears single-vision −1.75 for distance, comfortable at range',\n        chips: ['8 hrs · dual monitors', 'Heavy eyes by 5pm', 'Phone between meetings'],\n        saysLabel: 'She says', says: '“My glasses are fine — I can see the road, I can see the TV. It’s just that by the end of the day my eyes feel heavy and I get a dull headache behind them.”',\n        moveTitle: 'Your move', movePrompt: 'She has told you the symptom, not the cause. What do you say next?',\n        opts: [\n          { text: '“Then your prescription is still good — let’s look at frames while you’re here.”', ok: false, t: 'Not yet', fb: 'Her distance vision is fine, so nothing looks wrong on paper. But heavy eyes and an end-of-day headache are the classic accommodative signs, and letting them pass means she leaves with the same symptoms she walked in with.' },\n          { text: '“Tell me about your day — how many hours on a screen, and when do the eyes start to feel it?”', ok: true, t: 'Exactly right', fb: 'You open with her routine, not with a product. Hours, screen count and the time of day the strain arrives give you both the candidacy and the boost — and she reaches the conclusion with you rather than being sold to.' },\n          { text: '“It sounds like you need progressive lenses — they’ll fix the near work.”', ok: false, t: 'Wrong lens, wrong moment', fb: 'Nour is 34 and reading comfortably; there is no presbyopia to correct. A progressive introduces a corridor and an adaptation she does not need, and the word itself will make her defensive.' }\n        ],\n        scriptTitle: 'The words that work', you: 'You', her: 'Nour',\n        script: [\n          'Tell me about your daily routine — how many hours on the screen, phone, laptop?',\n          'Eight, easily. Two monitors, and my phone in between meetings.',\n          'And by the end of the day, do your eyes feel tired or heavy?',\n          'Heavy. And I lose focus when I try to read anything after six.',\n          'That is where an anti-fatigue lens helps. It does not change your distance vision — it gives your eyes a small support when you focus up close, so you do not feel that end-of-day strain.'\n        ],\n        recBody: 'A full working day at near, with real breaks away from screens. Zwei Ease at +0.75D carries the load through the afternoon without touching her distance vision.'\n      },\n      l3: {\n        eyebrow: '03 · The Mature Patient', h2: '“I’m not ready for progressives”',\n        body: 'Early presbyopia arrives with a preconception attached. This patient is not resisting a lens — he is resisting what he thinks it says about him. Handle that first, the optics second.',\n        name: 'Khalid, 43', meta: 'Contracts manager · Riyadh · Holds his phone further away than he used to. Came in for a frame, not a conversation.',\n        chips: ['Slow to refocus', 'Evening headaches', 'Rejects progressives'],\n        step1: 'Step one — open the door', step1Sub: 'He hasn’t mentioned near vision at all. How do you begin?',\n        opts1: [\n          { text: '“Do your eyes take a moment to refocus when you look up from your phone?”', ok: true, t: 'Well judged', fb: 'A question about a moment he has certainly noticed, with no label attached to it. He recognises himself in it, and the conversation is about comfort rather than about age.' },\n          { text: '“At your age most patients start needing reading support — shall we talk about progressives?”', ok: false, t: 'Closes the door', fb: 'Two things he came in resisting, in one sentence: his age and progressive lenses. Even if the optics are right, he will decline on principle and you lose the sale and the trust.' },\n          { text: '“Any problems with the glasses? No? Let’s get you fitted then.”', ok: false, t: 'Missed opening', fb: 'He will say no — patients report problems, not slow refocusing. The symptom you need is only reachable through a specific question about near tasks.' }\n        ],\n        objLabel: 'The objection', objection: '“My brother got those progressive lenses. He said he felt dizzy on stairs and never got used to them. I don’t want to go down that road — I’m only forty-three.”',\n        step2: 'Step two — answer it',\n        opts2: [\n          { text: '“Progressives have improved a lot since your brother’s pair — most people adapt within a week.”', ok: false, t: 'Defending the wrong product', fb: 'You are arguing with his experience and still selling him the lens he refused. Even a persuasive answer here leaves him bracing for adaptation.' },\n          { text: '“That’s a fair concern. What I have in mind isn’t a progressive — it keeps your normal vision and adds a small support for close-up. It’s dispensed as a single-vision lens.”', ok: true, t: 'That’s the move', fb: 'You acknowledge the concern without arguing, then separate your recommendation from the thing he rejected. Naming it as single vision removes the adaptation fear that his brother’s story created.' },\n          { text: '“You don’t have to decide today — have a think and come back if it gets worse.”', ok: false, t: 'Leaves him with the problem', fb: 'Retreating feels respectful but sends him home with the same evening headaches. The objection was about progressives, not about being helped — answer the objection you were actually given.' }\n        ],\n        posTitle: 'Position it, don’t defend it',\n        posA: 'Keeps his normal vision', posABody: 'Dispensed as single vision. A small near boost, no corridor to learn, no head-turning to find the sweet spot.',\n        posBLabel: 'Progressive', posB: 'Three zones to adapt to', posBBody: 'The right answer later, when near demand grows. Bringing it up now ends the conversation.',\n        recBody: 'Start at +0.75D for a mixed day; go to +1.00D when reading and screens dominate and the strain is already constant. Judge by visual demand, not by age alone.'\n      },\n      l4: {\n        eyebrow: '04 · Knowledge Check', count: ['Question ', ' of '], next: 'Next question', result: 'See my result', retake: 'Retake the check',\n        stats: ['Your score', 'Required', 'Correct'], correctOf: ' of ',\n        passed: 'Passed', failed: 'Not passed',\n        passTitle: 'Ready for the floor', failTitle: 'Worth another pass',\n        passBody: 'Completion has been recorded against your MAGRABi University record. One section left — the shop-floor summary, and the counter card you can keep behind the till.',\n        failBody: 'Below the 80% required to complete. Revisit the two patient sections — the feedback on each choice explains the reasoning — then take the check again.',\n        passCta: 'Continue to summary', failCta: 'Back to Section 02',\n        quiz: [\n          { q: 'A 31-year-old designer works across two monitors and reports heavy eyes and a dull headache each evening. Her distance vision in her current single-vision lenses is comfortable. What do you recommend?', opts: [\n            { text: 'Zwei Ease at +0.75D, keeping her current distance prescription', ok: true, t: 'Correct', fb: 'Full working day at near, no presbyopia, distance comfortable — the office-worker profile exactly. Her prescription stays; the boost carries the near load.' },\n            { text: 'A progressive lens with a low addition', ok: false, t: 'Not correct', fb: 'She is a non-presbyope reading comfortably. A progressive adds a corridor, lateral distortion and an adaptation period to solve a problem the small boost already solves.' },\n            { text: 'A new distance prescription — the strain suggests her Rx has shifted', ok: false, t: 'Not correct', fb: 'Her distance vision is comfortable and the symptoms arrive at the end of the day, which points to accommodative effort at near, not an inaccurate distance correction.' },\n            { text: 'Zwei Ease at +0.25D, the lightest boost', ok: false, t: 'Not correct', fb: 'Right lens, wrong boost. +0.25D is the kids profile; eight hours a day of near work needs +0.75D to hold comfort through the afternoon.' }\n          ] },\n          { q: 'A university student studies late, games most evenings and complains that text goes soft after a couple of hours. Which boost fits the profile?', opts: [\n            { text: '+0.50D', ok: true, t: 'Correct', fb: 'Students and gamers sit at +0.50D — long near sessions, frequent focus jumps and low light, but without the sustained eight-hour work pattern that calls for +0.75D.' },\n            { text: '+0.25D', ok: false, t: 'Not correct', fb: '+0.25D is designed for kids aged six to twenty-five in school days. This student’s near load is heavier and continues late into the evening.' },\n            { text: '+1.00D', ok: false, t: 'Not correct', fb: '+1.00D is reserved for mature patients with high near demand. On a young accommodating eye it is more support than the task requires.' },\n            { text: 'None — refer for a progressive', ok: false, t: 'Not correct', fb: 'There is no presbyopia here. Anti-fatigue lenses are for patients who are not progressive wearers, which is exactly this student.' }\n          ] },\n          { q: 'A 43-year-old tells you his brother hated his progressives and he doesn’t want anything like them. What is your best next line?', opts: [\n            { text: '“That’s a fair concern — what I have in mind isn’t a progressive. It keeps your normal vision with a small support up close, and it’s dispensed as single vision.”', ok: true, t: 'Correct', fb: 'Acknowledge, then separate. He hears that his objection has been respected and that your recommendation is not the thing he refused.' },\n            { text: '“Progressives are much better than they used to be — your brother was unlucky.”', ok: false, t: 'Not correct', fb: 'This defends a product he did not ask for and contradicts a story he trusts. You win the argument and lose the patient.' },\n            { text: '“Let’s just update your distance prescription for now.”', ok: false, t: 'Not correct', fb: 'It avoids the objection instead of answering it, and he leaves with the near strain that brought him in.' },\n            { text: '“You’ll need progressives eventually, so you may as well start adapting now.”', ok: false, t: 'Not correct', fb: 'Framing his future as inevitable decline confirms exactly the fear behind the resistance — and it isn’t the recommendation this consultation calls for.' }\n          ] },\n          { q: 'Which statement about Zwei Ease versus a progressive lens can you make to a patient with confidence?', opts: [\n            { text: 'It carries a small addition low in the lens, but the addition is too small to create noticeable lateral distortion — so it is marked and dispensed as single vision.', ok: true, t: 'Correct', fb: 'Technically accurate and honest. The principle is progressive at a very small scale; the patient experience is single vision.' },\n            { text: 'It has no addition at all — it is a coating that relaxes the eye.', ok: false, t: 'Not correct', fb: 'The relaxation comes from a slight positive power in the near zone, not from a coating. Zwei Ease is compatible with coatings, but that is not the mechanism.' },\n            { text: 'It has the same three viewing zones as a progressive, just weaker.', ok: false, t: 'Not correct', fb: 'A progressive gives distinct distance, intermediate and near zones. Zwei Ease gives one continuous field with a small boost — and no corridor to learn.' },\n            { text: 'It replaces progressives for presbyopic patients.', ok: false, t: 'Not correct', fb: 'It is for patients who are not progressive wearers, including early presbyopes needing modest near support. Established presbyopia still needs a progressive.' }\n          ] }\n        ]\n      },\n      l5: {\n        eyebrow: '05 · On the Shop Floor', h2: 'Three things to take to the counter',\n        takeaways: [\n          { title: 'Ask about the day, never about the lens', body: 'Hours on screen, how many screens, and when the eyes start to feel it. Three questions give you candidacy and boost in under a minute.' },\n          { title: 'Say “single vision” early', body: 'It removes the adaptation fear before it is raised — and it is accurate. The addition is real but too small to create a corridor.' },\n          { title: 'Choose the boost by demand, not by age', body: '+0.75D for a full working day; +1.00D when reading and screens dominate and the strain is already constant.' }\n        ],\n        cardTitle: 'Counter card', guide: 'Boost guide',\n        cheat: ['Kids, 6–25 — school, homework, screens at home', 'Students & gamers — long sessions, night study, low light', 'Office & remote workers — eight  hide: 'إخفاء',\n        adds: [\n          { name: 'الأطفال', body: 'من ٦ إلى ٢٥ سنة. يوم دراسي يتنقّل بين السبورة والدفتر واللابتوب، ثم شاشة في المنزل. أخف قيمة دعم تمنع الإجهاد قبل أن يصبح عادة.', scope: 'مشمول في البرنامج الكامل — غير مُقيَّم في هذه الوحدة.' },\n          { name: 'طلاب الجامعة واللاعبون', body: 'جلسات قراءة طويلة، ودراسة ليلية، ولعب ممتد. ينتقل التركيز بين الكتاب والشاشة والهاتف معظم اليوم، وغالبًا في إضاءة ضعيفة.', scope: 'مشمول في البرنامج الكامل — غير مُقيَّم في هذه الوحدة.' },\n          { name: 'موظفو المكاتب والعمل عن بعد', body: 'قرابة ثماني ساعات يوميًا أمام الشاشة، مع تنقّل مستمر بين المستندات والشاشات، وراحة حقيقية بعيدًا عن العمل القريب في المساء.', scope: 'مُقيَّم في هذه الوحدة — القسم ٠٢، نور.' },\n          { name: 'المرضى الأربعينيون وما بعدها', body: 'قصر نظر شيخي مبكر مع يوم مزدحم بالشاشات أو القراءة، ومقاومة للعدسات متعددة البؤر. أعلى قيمة دعم، وتُختار بحسب الاحتياج البصري لا بحسب العمر.', scope: 'مُقيَّم في هذه الوحدة — القسم ٠٣، خالد.' }\n        ]\n      },\n      l2: {\n        eyebrow: '٠٢ · موظّفة المكتب', h2: 'ثماني ساعات، وشاشتان، وعينان متعبتان',\n        name: 'نور، ٣٤ سنة', meta: 'مديرة تسويق · دبي · تستخدم عدسة أحادية −١٫٧٥ للبعيد ومرتاحة بها',\n        chips: ['٨ ساعات · شاشتان', 'ثقل في العين عند الخامسة', 'الهاتف بين الاجتماعات'],\n        saysLabel: 'تقول', says: '«نظارتي جيدة — أرى الطريق وأرى التلفاز. المشكلة أن عينيّ تثقلان في نهاية اليوم ويأتيني صداع خفيف خلفهما.»',\n        moveTitle: 'دورك الآن', movePrompt: 'ذكرت لك العَرَض لا السبب. بماذا تردّ؟',\n        opts: [\n          { text: '«إذن مقاسك ما زال سليمًا — لنطّلع على الإطارات ما دمت هنا.»', ok: false, t: 'ليس بعد', fb: 'نظرها للبعيد سليم، فلا شيء يبدو خطأً على الورق. لكن ثقل العين وصداع نهاية اليوم علامتان كلاسيكيتان لجهد المطابقة، وتجاوزهما يعني أنها ستخرج بالأعراض نفسها التي جاءت بها.' },\n          { text: '«حدّثيني عن يومك — كم ساعة أمام الشاشة، ومتى تبدأ العين تشعر بذلك؟»', ok: true, t: 'إجابة صحيحة تمامًا', fb: 'بدأت بروتينها لا بالمنتج. عدد الساعات وعدد الشاشات ووقت ظهور الإجهاد تمنحك الترشيح وقيمة الدعم معًا — وتصل هي إلى الاستنتاج معك بدل أن تشعر بأنها تُبَاع لها سلعة.' },\n          { text: '«يبدو أنك تحتاجين عدسات متعددة البؤر — ستحلّ مشكلة القريب.»', ok: false, t: 'عدسة خاطئة ووقت خاطئ', fb: 'نور في الرابعة والثلاثين وتقرأ بارتياح؛ لا يوجد قصر نظر شيخي يُصحَّح. متعددة البؤر تُدخل ممرًا بصريًا وتأقلمًا لا تحتاجهما، والكلمة نفسها ستجعلها متحفّزة للرفض.' }\n        ],\n        scriptTitle: 'الكلمات التي تنجح', you: 'أنت', her: 'نور',\n        script: [\n          'حدّثيني عن روتين يومك — كم ساعة على الشاشة والهاتف واللابتوب؟',\n          'ثماني ساعات بسهولة. شاشتان، وهاتفي بين الاجتماعات.',\n          'وفي نهاية اليوم، هل تشعرين أن عينيك متعبتان أو ثقيلتان؟',\n          'ثقيلتان. وأفقد التركيز إذا حاولت القراءة بعد السادسة.',\n          'هنا تفيد العدسة المضادة للإجهاد. لا تغيّر نظرك للبعيد — بل تمنح عينيك دعمًا صغيرًا عند التركيز القريب، فلا تشعرين بإجهاد نهاية اليوم.'\n        ],\n        recBody: 'يوم عمل كامل على مسافة قريبة، مع فترات راحة حقيقية بعيدًا عن الشاشات. Zwei Ease بقيمة ‎+0.75D تحمل هذا العبء حتى نهاية النهار دون المساس بنظرها للبعيد.'\n      },\n      l3: {\n        eyebrow: '٠٣ · المريض الأربعيني', h2: '«لست مستعدًا للعدسات متعددة البؤر»',\n        body: 'يأتي قصر النظر الشيخي المبكر ومعه فكرة مسبقة. هذا المريض لا يقاوم عدسة — بل يقاوم ما يظن أنها تقوله عنه. عالج ذلك أولًا، ثم البصريات ثانيًا.',\n        name: 'خالد، ٤٣ سنة', meta: 'مدير عقود · الرياض · يُبعِد هاتفه أكثر من قبل. جاء ليختار إطارًا، لا ليخوض محادثة.',\n        chips: ['بطء في إعادة التركيز', 'صداع مسائي', 'يرفض متعددة البؤر'],\n        step1: 'الخطوة الأولى — افتح الحوار', step1Sub: 'لم يذكر النظر القريب إطلاقًا. كيف تبدأ؟',\n        opts1: [\n          { text: '«هل تحتاج عيناك لحظة لإعادة التركيز عندما ترفع نظرك عن الهاتف؟»', ok: true, t: 'تقدير سليم', fb: 'سؤال عن لحظة لاحظها بالتأكيد، وبلا أي تصنيف ملتصق بها. يرى نفسه فيه، فتصبح المحادثة عن الراحة لا عن العمر.' },\n          { text: '«في عمرك يبدأ معظم المرضى باحتياج دعم للقراءة — نتحدث عن متعددة البؤر؟»', ok: false, t: 'يُغلق الباب', fb: 'أمران جاء رافضًا لهما في جملة واحدة: عمره والعدسات متعددة البؤر. حتى لو كانت البصريات صحيحة، سيرفض من حيث المبدأ فتفقد البيع والثقة معًا.' },\n          { text: '«هل من مشكلة في النظارة؟ لا؟ إذن نكمل القياس.»', ok: false, t: 'فرصة ضائعة', fb: 'سيقول لا — فالمرضى يذكرون «المشاكل» لا بطء إعادة التركيز. العَرَض الذي تحتاجه لا يُبلَغ إليه إلا بسؤال محدد عن المهام القريبة.' }\n        ],\n        objLabel: 'الاعتراض', objection: '«أخي جرّب تلك العدسات متعددة البؤر. قال إنه يشعر بالدوار على السلالم ولم يتأقلم معها أبدًا. لا أريد أن أسلك هذا الطريق — عمري ثلاثة وأربعون فقط.»',\n        step2: 'الخطوة الثانية — أجب عنه',\n        opts2: [\n          { text: '«تحسّنت متعددة البؤر كثيرًا منذ نظارة أخيك — معظم الناس يتأقلمون في أسبوع.»', ok: false, t: 'دفاع عن المنتج الخطأ', fb: 'أنت تجادل تجربته، وتستمر في عرض العدسة التي رفضها. حتى الإجابة المقنعة هنا تتركه متوجّسًا من التأقلم.' },\n          { text: '«قلق مشروع. ما أقصده ليس عدسة متعددة البؤر — إنها تحفظ نظرك المعتاد وتضيف دعمًا صغيرًا للقريب، وتُصرف كعدسة أحادية الرؤية.»', ok: true, t: 'هذه هي الخطوة الصحيحة', fb: 'تعترف بالقلق دون جدال، ثم تفصل توصيتك عن الشيء الذي رفضه. وتسميتها «أحادية الرؤية» تُزيل خوف التأقلم الذي زرعته قصة أخيه.' },\n          { text: '«لا حاجة لأن تقرر اليوم — فكّر وارجع إن ازداد الأمر سوءًا.»', ok: false, t: 'يتركه مع المشكلة', fb: 'التراجع يبدو محترمًا لكنه يعيده إلى المنزل بصداع المساء نفسه. الاعتراض كان على متعددة البؤر لا على المساعدة — فأجب عن الاعتراض الذي طُرح فعلًا.' }\n        ],\n        posTitle: 'قدّمها في موضعها، ولا تدافع عنها',\n        posA: 'تحفظ نظره المعتاد', posABody: 'تُصرف كعدسة أحادية الرؤية. دعم قريب صغير، بلا ممرّ يُتعلَّم، وبلا تحريك للرأس بحثًا عن المنطقة المناسبة.',\n        posBLabel: 'متعددة البؤر', posB: 'ثلاث مناطق تتطلب تأقلمًا', posBBody: 'هي الجواب الصحيح لاحقًا، عندما يزداد الاحتياج القريب. أما طرحها الآن فينهي المحادثة.',\n        recBody: 'ابدأ بـ ‎+0.75D لليوم المختلط، وانتقل إلى ‎+1.00D عندما تسيطر القراءة والشاشات ويكون الإجهاد مستمرًا. الحكم بالاحتياج البصري لا بالعمر وحده.'\n      },\n      l4: {\n        eyebrow: '٠٤ · اختبار المعرفة', count: ['السؤال ', ' من '], next: 'السؤال التالي', result: 'اعرض نتيجتي', retake: 'إعادة الاختبار',\n        stats: ['نتيجتك', 'المطلوب', 'الإجابات الصحيحة'], correctOf: ' من ',\n        passed: 'ناجح', failed: 'غير مجتاز',\n        passTitle: 'جاهز لصالة البيع', failTitle: 'تستحق محاولة أخرى',\n        passBody: 'تم تسجيل إتمامك في سجلّك على أكاديمية مغربي. بقي قسم واحد — ملخّص صالة البيع، وبطاقة الكاونتر التي يمكنك الاحتفاظ بها.',\n        failBody: 'أقل من ٨٠٪ المطلوبة للإتمام. راجع قسمَي المريضين — التغذية الراجعة على كل خيار تشرح السبب — ثم أعد الاختبار.',\n        passCta: 'المتابعة إلى الملخّص', failCta: 'العودة إلى القسم ٠٢',\n        quiz: [\n          { q: 'مصمّمة في الحادية والثلاثين تعمل على شاشتين وتشكو من ثقل في العين وصداع خفيف كل مساء، ونظرها للبعيد بعدساتها الأحادية مريح. بماذا توصي؟', opts: [\n            { text: 'Zwei Ease بقيمة ‎+0.75D مع الإبقاء على مقاسها الحالي للبعيد', ok: true, t: 'إجابة صحيحة', fb: 'يوم عمل كامل على القريب، دون قصر نظر شيخي، ونظر بعيد مريح — أي ملف موظفي المكاتب تمامًا. يبقى المقاس كما هو، ويحمل الدعم عبء القريب.' },\n            { text: 'عدسة متعددة البؤر بإضافة منخفضة', ok: false, t: 'إجابة غير صحيحة', fb: 'هي غير مصابة بقصر النظر الشيخي وتقرأ بارتياح. متعددة البؤر تضيف ممرًا وتشويشًا جانبيًا وفترة تأقلم لحل مشكلة يحلّها الدعم الصغير أصلًا.' },\n            { text: 'مقاس جديد للبعيد — فالإجهاد يشير إلى تغيّر المقاس', ok: false, t: 'إجابة غير صحيحة', fb: 'نظرها للبعيد مريح والأعراض تظهر في نهاية اليوم، وهذا يشير إلى جهد المطابقة على القريب لا إلى تصحيح غير دقيق للبعيد.' },\n            { text: 'Zwei Ease بقيمة ‎+0.25D، أخفّ دعم', ok: false, t: 'إجابة غير صحيحة', fb: 'العدسة صحيحة والقيمة خاطئة. ‎+0.25D لملف الأطفال؛ وثماني ساعات يومية من العمل القريب تحتاج ‎+0.75D لتبقى الراحة حتى نهاية النهار.' }\n          ] },\n          { q: 'طالب جامعي يدرس حتى وقت متأخر ويلعب معظم الأمسيات ويشكو من تشوّش النص بعد ساعتين. أي قيمة دعم تناسب ملفه؟', opts: [\n            { text: '‎+0.50D', ok: true, t: 'إجابة صحيحة', fb: 'الطلاب واللاعبون عند ‎+0.50D — جلسات قريبة طويلة وانتقالات تركيز متكررة وإضاءة ضعيفة، دون نمط العمل المتواصل ثماني ساعات الذي يستدعي ‎+0.75D.' },\n            { text: '‎+0.25D', ok: false, t: 'إجابة غير صحيحة', fb: '‎+0.25D مصممة للأطفال من ٦ إلى ٢٥ سنة في يوم دراسي. عبء هذا الطالب على القريب أثقل ويمتد إلى ساعات متأخرة.' },\n            { text: '‎+1.00D', ok: false, t: 'إجابة غير صحيحة', fb: '‎+1.00D مخصصة للمرضى الأربعينيين ذوي الاحتياج القريب العالي. وعلى عين شابة قادرة على المطابقة تكون دعمًا أكثر مما تتطلبه المهمة.' },\n            { text: 'لا شيء — يُحوَّل إلى عدسة متعددة البؤر', ok: false, t: 'إجابة غير صحيحة', fb: 'لا يوجد قصر نظر شيخي هنا. العدسات المضادة للإجهاد لمن لا يستخدم متعددة البؤر، وهذا وصف هذا الطالب بدقة.' }\n          ] },\n          { q: 'مريض في الثالثة والأربعين يقول إن أخاه كره عدساته متعددة البؤر وإنه لا يريد شيئًا مشابهًا. ما أفضل جملة تقولها بعد ذلك؟', opts: [\n            { text: '«قلق مشروع — ما أقصده ليس عدسة متعددة البؤر. إنها تحفظ نظرك المعتاد وتضيف دعمًا صغيرًا للقريب، وتُصرف كعدسة أحادية الرؤية.»', ok: true, t: 'إجابة صحيحة', fb: 'اعترف ثم افصل. يسمع أن اعتراضه قد احتُرم، وأن توصيتك ليست الشيء الذي رفضه.' },\n            { text: '«متعددة البؤر أفضل بكثير مما كانت — أخوك كان سيّئ الحظ.»', ok: false, t: 'إجابة غير صحيحة', fb: 'هذا دفاع عن منتج لم يطلبه، ومناقضة لقصة يثق بها. تكسب الجدال وتخسر المريض.' },\n            { text: '«لنحدّث مقاسك للبعيد فقط في الوقت الحالي.»', ok: false, t: 'إجابة غير صحيحة', fb: 'يتجنّب الاعتراض بدل الإجابة عنه، فيخرج المريض بإجهاد القريب نفسه الذي أتى به.' },\n            { text: '«ستحتاج متعددة البؤر في النهاية، فالأفضل أن تبدأ التأقلم الآن.»', ok: false, t: 'إجابة غير صحيحة', fb: 'تصوير مستقبله كتدهوّر محتوم يؤكد تحديدًا الخوف الكامن خلف المقاومة — وليست هي التوصية التي تستدعيها هذه الاستشارة.' }\n          ] },\n          { q: 'أي عبارة عن Zwei Ease مقابل العدسة م
